<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OutShipAI — You're offline</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #18181b;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        display: inline-grid;
        place-items: center;
        margin-bottom: 24px;
      }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
      p { color: #52525b; line-height: 1.6; margin-bottom: 8px; }
      button {
        margin-top: 24px;
        padding: 12px 28px;
        border: none;
        border-radius: 10px;
        background: #7c3aed;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #6d28d9; }
      .hint { font-size: 13px; color: #a1a1aa; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="40" height="40" viewBox="0 0 512 512">
          <path d="M136 176 L256 268 L376 176" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="116" y="146" width="280" height="220" rx="40" fill="none" stroke="#fff" stroke-width="30"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>OutShipAI needs an internet connection to send emails, find leads, and sync your campaigns.</p>
      <p>Anything you've already loaded is still available. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry connection</button>
      <p class="hint">Your queued follow-ups keep running on our servers even when you're offline.</p>
    </div>
  </body>
</html>
